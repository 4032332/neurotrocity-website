<style>
:root{--bg:#08080D;--well:#05050a;--panel:#101018;--line:#20202E;--line2:#2b2b3d;
--ink:#F3F3F8;--muted:#8C8CA6;--volt:#7C6BFF;--cyan:#38E1D6;
--dose:#6C97F5;--dis:#FFB627;--rw:#0EA968;
--sans:"Manrope",-apple-system,system-ui,sans-serif;--mono:"Plex",ui-monospace,Menlo,monospace;--maxw:1120px}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}h1,h2,h3,p{margin:0}
::selection{background:var(--volt);color:#fff}
.nova{display:block;flex:none}
.nova-spin{transform-origin:100px 100px;animation:nspin 48s linear infinite}
.nova-ring{transform-origin:100px 100px;animation:nbreathe 3.6s ease-in-out infinite}
.nova-node{animation:ntwinkle 2.8s ease-in-out infinite}
.nova-spark{animation:ntwinkle 1.9s ease-in-out infinite}
.nova-node:nth-of-type(2){animation-delay:.35s}.nova-node:nth-of-type(3){animation-delay:.7s}
.nova-node:nth-of-type(4){animation-delay:1.05s}.nova-node:nth-of-type(5){animation-delay:1.4s}
.nova-node:nth-of-type(6){animation-delay:1.75s}.nova-node:nth-of-type(7){animation-delay:2.1s}
.nova-node:nth-of-type(8){animation-delay:2.45s}
@keyframes nspin{to{transform:rotate(360deg)}}
@keyframes nbreathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.14);opacity:1}}
@keyframes ntwinkle{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
.mk{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.mk .t{color:var(--volt)}.mk .wm{white-space:nowrap}
@media(prefers-reduced-motion:reduce){.nova-spin,.nova-ring,.nova-node,.nova-spark{animation:none!important}}

/* z-index:0, NOT -1. A fixed element at -1 paints behind the body's own
   background, so an opaque body hides the canvas completely — the cortex
   renders correctly and is never seen. Content sits above via .page. */
#bgnet{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;background:var(--bg)}
.page{max-width:430px;margin:0 auto;padding-bottom:64px;position:relative;z-index:1}
.hero{position:relative;padding:52px 24px 60px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 100% at 50% -10%,rgba(23,23,58,.5),rgba(8,8,13,.78) 72%)}
.hero .veil{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 8%,transparent 40%,rgba(8,8,13,.66) 92%)}
.avatar{position:relative;z-index:2;width:96px;height:96px;margin:0 auto 18px;border-radius:50%;
  background:rgba(16,16,24,.5);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  box-shadow:0 0 0 6px rgba(124,107,255,.08)}
.nm{position:relative;z-index:2;font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.04;
  text-shadow:0 0 30px rgba(124,107,255,.5),0 0 62px rgba(56,225,214,.22)}
.role{position:relative;z-index:2;margin-top:8px;font-size:14.5px;color:var(--muted)}
.role .org{color:var(--cyan);font-weight:700}
.quick{position:relative;z-index:2;display:flex;justify-content:center;gap:14px;margin-top:24px}
.quick a{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(16,16,24,.55);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  /* scoped, NOT `transition:all` — a blanket transition also animates the
     inline opacity/transform GSAP writes, which strands the tween on Safari */
  transition:border-color .15s,transform .15s,background .15s}
.quick a:hover{transform:translateY(-2px);border-color:var(--volt)}
.quick svg{width:20px;height:20px;color:var(--cyan)}
.save-wrap{padding:0 24px;margin-top:-24px;position:relative;z-index:3}
.save{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:rgba(16,16,24,.6);border:1px solid rgba(124,107,255,.4);font-weight:700;font-size:15px;
  padding:14px 20px;border-radius:14px;
  -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
  transition:border-color .18s,transform .18s,background .18s}
.save:hover{transform:translateY(-2px);border-color:var(--volt);background:#151527}
.save svg{width:19px;height:19px;color:var(--cyan)}
.card{margin:18px 24px 0;background:rgba(16,16,24,.58);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(11px);backdrop-filter:blur(11px);
  border-radius:16px;overflow:hidden}
.row{display:flex;flex-direction:column;gap:3px;padding:16px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row .v{font-size:15.5px;font-weight:600}.row .v a{color:var(--cyan)}
.foot{text-align:center;margin-top:28px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.foot a:hover{color:var(--ink)}
</style>
</head>

<script>
(function(){
var cx=window.__cx=NTCortex(document.getElementById('bgnet'),
  {hubs:11,maxFibers:250,branchLen:0.7,spread:0.9,lineAlpha:0.5,nodeAlpha:0.85,fire:0.07,spin:0.055,radius:0.4,cy:0.36});
if(window.gsap){
  gsap.registerPlugin(ScrollTrigger);
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from('.avatar',{scale:.82,opacity:0,duration:.8},0)
    .from('.nm',{y:22,opacity:0,duration:.85},0.18)
    .from('.role',{y:14,opacity:0,duration:.7},0.36)
    .from('.quick a',{y:14,opacity:0,duration:.55,stagger:.08},0.5)
    .from('.save',{y:16,opacity:0,duration:.7},0.66)
    .from('.card .row',{y:14,opacity:0,duration:.55,stagger:.08},0.78)
    .from('.foot',{opacity:0,duration:.6},1.05);

  /* Fail-safe. gsap.from() writes opacity:0 inline immediately, but rAF is
     throttled in a background tab — so a card opened in one (a QR scan that
     lands in the background, session restore) would sit with the name invisible.
     Snap the entrance to its end state if it hasn't actually run. A no-op for
     normal visitors, whose timeline has completed by the time this fires. */
  /* Safari (iOS 18) can leave a child tween rendered at its START state even
     when the parent timeline reports progress 1 — .quick a and .save were stuck
     at inline opacity:0. Forcing progress is not enough, so strip the inline
     props GSAP wrote and let the stylesheet's visible state stand. */
  var REVEALED='.avatar,.nm,.role,.quick a,.save,.card .row,.foot';
  function settleEntrance(){
    if(tl.progress()<1) tl.progress(1);
    gsap.set(REVEALED,{clearProps:'opacity,transform,translate,rotate,scale'});
  }
  tl.eventCallback('onComplete',settleEntrance);
  if(document.hidden) settleEntrance();
  setTimeout(settleEntrance,2200);
  addEventListener('pageshow',function(e){ if(e.persisted) settleEntrance(); });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden) ScrollTrigger.refresh();
  });

  if(!reduce&&cx){
    tl.from(cx.view,{zoom:0.7,duration:2.3,ease:'power2.out'},0);
    gsap.to(cx.view,{yaw:1.5,pitch:0.26,ease:'none',
      scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:0.8}});
  }
}
})();
</script>
