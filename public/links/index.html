  :root{
    --ground:#07060E; --lav:#A78AF9; --bone:#F3F0EA; --line:#221D3A; --ink:#EFEEF7; --muted:#918DB0;
    --volt:#7C6BFF; --pink:#FF78CD; --cyan:#38E1D6; --gold:#FFC43D; --jade:#22C489;
    --display:"Bricolage Grotesque",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  .page{max-width:440px;margin:0 auto;min-height:100svh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 32px) 22px calc(env(safe-area-inset-bottom) + 24px)}

  .hd{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:34px}
  .hd img{width:104px;height:104px;mix-blend-mode:screen}
  .hd h1{margin:0;color:var(--bone);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
  .hd h1 span{color:var(--lav)}

  /* The spine: one line threading every link, coloured as it passes each node. */
  .links{position:relative;padding-left:36px}
  .links::before{content:"";position:absolute;left:10px;top:29px;bottom:29px;width:2px;opacity:.7;
    background:linear-gradient(var(--volt),var(--pink),var(--cyan),var(--gold),var(--jade))}
  .links a{position:relative;display:flex;align-items:center;justify-content:space-between;height:58px;
    font-weight:700;font-size:22px;letter-spacing:-.02em}
  .links a::before{content:"";position:absolute;left:-33px;width:16px;height:16px;border-radius:50%;
    background:var(--ground);border:2px solid var(--c);box-shadow:0 0 14px var(--c);transition:background .18s,transform .18s}
  .links a b{font-weight:500;color:var(--c);transition:transform .18s}
  .links a:hover::before,.links a:focus-visible::before,.links a:active::before{background:var(--c);transform:scale(1.15)}
  .links a:hover b,.links a:focus-visible b{transform:translateX(4px)}
  .links a:focus-visible{outline:none}

  .soc{display:flex;justify-content:center;gap:10px;margin-top:34px}
  .soc a{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:rgba(7,6,14,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:color .18s,border-color .18s}
  .soc a:hover,.soc a:focus-visible{color:var(--cyan);border-color:var(--cyan);outline:none}
  .soc svg{width:21px;height:21px}
